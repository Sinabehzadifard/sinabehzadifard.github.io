params:
    description: "Sina Behzadifard is a postdoctoral researcher at Chalmers University of Technology studying environmental operations management and repair decisions."
    author: Sina Behzadifard
    # googleAnalyticsID: "G-BREBRET3HH"
    DateFormat: "January 2006"
    defaultTheme: light
