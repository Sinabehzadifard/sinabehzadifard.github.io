    comments: false
    math: true
    profileMode:
          enabled: true
          title: Sina Behzadifard
          subtitle: "I am a postdoctoral researcher in Supply and Operations Management at Chalmers University of Technology. I study how manufacturers organize environmental practices across plants and how the information consumers receive in repair quotes shapes their decisions."
